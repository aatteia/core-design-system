<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:350px">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <div class="meta">Buttons — Primary / Secondary / Tertiary × default / hover / focus / disabled. Pills, Roboto Bold 16, letter-spacing 0.5 px.</div>
  <div class="col" style="gap:14px">
    <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn p def">Primary</button><button class="btn p hov">Primary</button>
      <button class="btn p foc">Primary</button><button class="btn p dis">Primary</button>
    </div>
    <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn s def">Secondary</button><button class="btn s hov">Secondary</button>
      <button class="btn s foc">Secondary</button><button class="btn s dis">Secondary</button>
    </div>
    <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn t def">Tertiary</button><button class="btn t hov">Tertiary</button>
      <button class="btn t foc">Tertiary</button><button class="btn t dis">Tertiary</button>
    </div>
    <div class="row" style="gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn p def"><i class="fa-solid fa-magnifying-glass"></i> With icon</button>
      <button class="btn p def">Continue <i class="fa-solid fa-arrow-right"></i></button>
      <button class="btn p def" style="width:48px;height:48px;padding:0;justify-content:center" aria-label="Add"><i class="fa-solid fa-plus"></i></button>
      <button class="btn d def">Delete</button>
    </div>
  </div>
  <style>
    .btn{font-family:Roboto;font-weight:700;font-size:16px;letter-spacing:.5px;border-radius:200px;padding:12px 20px;line-height:16px;cursor:pointer;border:1px solid transparent;display:inline-flex;gap:8px;align-items:center;justify-content:center}
    .btn.p.def{background:#3C4673;color:#fff;border-color:#3C4673}
    .btn.p.hov{background:#2B3350;color:#fff;border-color:#2B3350}
    .btn.p.foc{background:#3C4673;color:#fff;border-color:#3C4673;outline:2px solid #B900DA;outline-offset:2px}
    .btn.p.dis{background:#F2F2F2;color:#868686;border-color:#F2F2F2;cursor:not-allowed}
    .btn.s.def{background:#fff;color:#3C4673;border-color:#3C4673}
    .btn.s.hov{background:#F9F5F9;color:#3C4673;border:2px solid #3C4673;padding:11px 19px}
    .btn.s.foc{background:#fff;color:#3C4673;border-color:#3C4673;outline:2px solid #B900DA;outline-offset:2px}
    .btn.s.dis{background:#fff;color:#868686;border-color:#EBEBEB;cursor:not-allowed}
    .btn.t.def{background:transparent;color:#3C4673}
    .btn.t.hov{background:#F8F8F8;color:#3C4673}
    .btn.t.foc{background:transparent;color:#3C4673;outline:2px solid #B900DA;outline-offset:2px}
    .btn.t.dis{background:transparent;color:#868686;cursor:not-allowed}
    .btn.d.def{background:#AC0700;color:#fff;border-color:#AC0700}
  </style></div></body></html>
