<!doctype html>
<html><head><meta charset="utf-8"><title>Badges & chips</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:170px">
  <div class="meta">Badges — neutral / primary / info / success / warning / error / dark. Chips — pill, toggleable.</div>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
    <span class="bg" style="background:#F2F2F2;color:#1A1A1A">Default</span>
    <span class="bg" style="background:#F4EFF6;color:#2B3350">Primary</span>
    <span class="bg" style="background:#EBF3FB;color:#00386B">Info</span>
    <span class="bg" style="background:#EBF5EE;color:#1A412A">Success</span>
    <span class="bg" style="background:#FBF1DB;color:#6B4400">Warning</span>
    <span class="bg" style="background:#FBEFEC;color:#AC0700">Error</span>
    <span class="bg" style="background:#1A1A1A;color:#fff">Dark</span>
  </div>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
    <span class="chip on">All ✕</span>
    <span class="chip">Inbox</span>
    <span class="chip">Starred</span>
    <span class="chip">Archive</span>
    <span class="chip">Drafts</span>
  </div>
  <style>
    .bg{font-family:Inter;font-weight:500;font-size:12px;line-height:16px;padding:2px 8px;border-radius:4px}
    .chip{font-family:'Open Sans';font-weight:600;font-size:14px;padding:6px 12px;border-radius:200px;background:#fff;border:1px solid #ADADAD;color:#1A1A1A;cursor:pointer}
    .chip.on{background:#3C4673;color:#fff;border-color:#3C4673}
  </style></div></body></html>
