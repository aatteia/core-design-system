<!doctype html>
<html><head><meta charset="utf-8"><title>Fonts</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:190px">
  <div class="meta">Families — Roboto (headings), Open Sans (body), Inter (UI &amp; numerics). All three ship as variable fonts; weight axis covers 100–900.</div>
  <div class="row" style="gap:24px">
    <div class="col" style="flex:1">
      <div class="kbd-meta">ROBOTO · headings</div>
      <div style="font-family:Roboto;font-weight:300;font-size:42px;line-height:1;color:#1A1A1A;letter-spacing:-0.02em">Aa Bb Cc</div>
      <div style="display:flex;gap:8px;align-items:baseline">
        <span style="font-family:Roboto;font-weight:300;font-size:14px;color:#5C5C5C">Light</span>
        <span style="font-family:Roboto;font-weight:400;font-size:14px;color:#5C5C5C">Reg</span>
        <span style="font-family:Roboto;font-weight:500;font-size:14px;color:#5C5C5C">Med</span>
        <span style="font-family:Roboto;font-weight:700;font-size:14px;color:#5C5C5C">Bold</span>
      </div>
    </div>
    <div class="col" style="flex:1">
      <div class="kbd-meta">OPEN SANS · body</div>
      <div style="font-family:'Open Sans';font-weight:400;font-size:42px;line-height:1;color:#1A1A1A">Aa Bb Cc</div>
      <div style="display:flex;gap:8px;align-items:baseline">
        <span style="font-family:'Open Sans';font-weight:400;font-size:14px;color:#5C5C5C">Reg</span>
        <span style="font-family:'Open Sans';font-weight:600;font-size:14px;color:#5C5C5C">SemiBold</span>
        <span style="font-family:'Open Sans';font-weight:700;font-size:14px;color:#5C5C5C">Bold</span>
        <span style="font-family:'Open Sans';font-weight:400;font-style:italic;font-size:14px;color:#5C5C5C">Italic</span>
      </div>
    </div>
    <div class="col" style="flex:1">
      <div class="kbd-meta">INTER · UI</div>
      <div style="font-family:Inter;font-weight:500;font-size:42px;line-height:1;color:#1A1A1A">Aa Bb Cc</div>
      <div style="display:flex;gap:8px;align-items:baseline">
        <span style="font-family:Inter;font-weight:400;font-size:14px;color:#5C5C5C">Reg</span>
        <span style="font-family:Inter;font-weight:500;font-size:14px;color:#5C5C5C">Med</span>
        <span style="font-family:Inter;font-weight:600;font-size:14px;color:#5C5C5C">SemiBold</span>
        <span style="font-family:Inter;font-weight:700;font-size:14px;color:#5C5C5C">Bold</span>
      </div>
    </div>
  </div>
</div></body></html>
