<!doctype html>
<html><head><meta charset="utf-8"><title>Breadcrumbs & pagination</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:170px">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <div class="meta">Breadcrumbs and pagination — Brand links, Nobel separators. Current page bold, no underline.</div>
  <div class="col" style="gap:14px">
    <div style="font-family:'Open Sans';font-size:14px;color:#5C5C5C">
      <a href="#" style="color:#3C4673">Home</a>
      <span style="color:#ADADAD;margin:0 6px">/</span>
      <a href="#" style="color:#3C4673">Enrolment</a>
      <span style="color:#ADADAD;margin:0 6px">/</span>
      <span style="color:#1A1A1A;font-weight:600">Check my enrolment</span>
    </div>
    <div class="row" style="gap:6px;align-items:center;font-family:Inter;font-size:14px">
      <button class="pg"><i class="fa-solid fa-chevron-left"></i> Previous</button>
      <button class="pg n">1</button>
      <button class="pg n on">2</button>
      <button class="pg n">3</button>
      <span style="color:#ADADAD">…</span>
      <button class="pg n">12</button>
      <button class="pg">Next <i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>
  <style>
    .pg{font-family:Inter;font-weight:600;font-size:14px;background:transparent;border:0;color:#3C4673;cursor:pointer;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
    .pg.n{width:36px;height:36px;justify-content:center;padding:0;border-radius:200px}
    .pg.n.on{background:#3C4673;color:#fff}
  </style></div></body></html>
