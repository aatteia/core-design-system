<!doctype html>
<html><head><meta charset="utf-8"><title>Alerts & callouts</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:290px">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <div class="meta">Inline alerts — info / success / warning / error. Tinted background, semantic icon, optional close.</div>
  <div class="col" style="gap:8px">
    
      <div style="background:#EBF3FB;color:#00386B;border-radius:4px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-family:'Open Sans';font-size:14px;line-height:20px">
        <i class="fa-solid fa-circle-info" style="font-size:18px;margin-top:1px"></i>
        <div style="flex:1"><b style="text-transform:capitalize;display:block;font-weight:600">info</b>Your enrolment is up to date.</div>
        <i class="fa-solid fa-xmark" style="opacity:.6;cursor:pointer"></i>
      </div>
      <div style="background:#EBF5EE;color:#1A412A;border-radius:4px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-family:'Open Sans';font-size:14px;line-height:20px">
        <i class="fa-solid fa-circle-check" style="font-size:18px;margin-top:1px"></i>
        <div style="flex:1"><b style="text-transform:capitalize;display:block;font-weight:600">success</b>You're successfully enrolled to vote.</div>
        <i class="fa-solid fa-xmark" style="opacity:.6;cursor:pointer"></i>
      </div>
      <div style="background:#FBF1DB;color:#6B4400;border-radius:4px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-family:'Open Sans';font-size:14px;line-height:20px">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:18px;margin-top:1px"></i>
        <div style="flex:1"><b style="text-transform:capitalize;display:block;font-weight:600">warning</b>Enrolments close at 8 pm tonight.</div>
        <i class="fa-solid fa-xmark" style="opacity:.6;cursor:pointer"></i>
      </div>
      <div style="background:#FBEFEC;color:#AC0700;border-radius:4px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-family:'Open Sans';font-size:14px;line-height:20px">
        <i class="fa-solid fa-circle-exclamation" style="font-size:18px;margin-top:1px"></i>
        <div style="flex:1"><b style="text-transform:capitalize;display:block;font-weight:600">error</b>We couldn't find your details. Try again.</div>
        <i class="fa-solid fa-xmark" style="opacity:.6;cursor:pointer"></i>
      </div>
  </div></div></body></html>
