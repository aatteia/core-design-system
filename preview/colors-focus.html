<!doctype html>
<html><head><meta charset="utf-8"><title>Focus colour</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:200px">
  <div class="meta">Focus — distinct magenta, used only as the keyboard-focus ring. Never as a fill on product surfaces.</div>
  <div class="row">
    <div class="swatch" style="background:#B900DA;min-height:120px;flex:0 0 200px"><div class="swatch__name">Focus</div><div class="swatch__code">#B900DA</div></div>
    <div class="col" style="flex:1;justify-content:center">
      <div style="display:inline-flex;gap:12px;align-items:center">
        <button style="background:#3C4673;color:#fff;border:0;border-radius:200px;padding:12px 24px;font-family:Roboto;font-weight:700;font-size:16px;outline:2px solid #B900DA;outline-offset:2px">Primary CTA</button>
        <input style="border:1px solid #3C4673;border-radius:4px;padding:8px 12px;outline:2px solid #B900DA;outline-offset:1px;min-width:160px" value="Focused input">
      </div>
      <div class="kbd-meta">outline: 2px solid #B900DA · offset 2px</div>
    </div>
  </div>
</div></body></html>
