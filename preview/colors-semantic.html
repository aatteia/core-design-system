<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:270px">
  <div class="meta">Semantic — info / success / warning / error. Shown as 500 / 700 / 100. Text on tint uses the 700 step.</div>
  <div class="row" style="gap:14px">
    
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Info</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#2767B0;min-height:64px"><div class="swatch__name">Info</div><div class="swatch__code">#2767B0</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#14447B;min-height:42px"><div class="swatch__code">#14447B</div></div>
          <div class="swatch swatch--light" style="background:#E7EFF8;min-height:42px"><div class="swatch__code">#E7EFF8</div></div>
        </div>
      </div>
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Success</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#268257;min-height:64px"><div class="swatch__name">Success</div><div class="swatch__code">#268257</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#1C5F3F;min-height:42px"><div class="swatch__code">#1C5F3F</div></div>
          <div class="swatch swatch--light" style="background:#EAF6F0;min-height:42px"><div class="swatch__code">#EAF6F0</div></div>
        </div>
      </div>
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Warning</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#D5770B;min-height:64px"><div class="swatch__name">Warning</div><div class="swatch__code">#D5770B</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#9B5608;min-height:42px"><div class="swatch__code">#9B5608</div></div>
          <div class="swatch swatch--light" style="background:#FBF2DF;min-height:42px"><div class="swatch__code">#FBF2DF</div></div>
        </div>
      </div>
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Error</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#AB2117;min-height:64px"><div class="swatch__name">Error</div><div class="swatch__code">#AB2117</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#911A12;min-height:42px"><div class="swatch__code">#911A12</div></div>
          <div class="swatch swatch--light" style="background:#FBEBE9;min-height:42px"><div class="swatch__code">#FBEBE9</div></div>
        </div>
      </div>
  </div>
</div></body></html>
