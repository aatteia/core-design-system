<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:270px">
  <div class="meta">Semantic — info / success / warning / error. Each ships a 25→800 scale; shown here as 600 / 700 / 100.</div>
  <div class="row" style="gap:14px">
    
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Info</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#2370BE;min-height:64px"><div class="swatch__name">Info</div><div class="swatch__code">#2370BE</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#00386B;min-height:42px"><div class="swatch__code">#00386B</div></div>
          <div class="swatch swatch--light" style="background:#EBF3FB;min-height:42px"><div class="swatch__code">#EBF3FB</div></div>
        </div>
      </div>
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Success</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#278251;min-height:64px"><div class="swatch__name">Success</div><div class="swatch__code">#278251</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#1A412A;min-height:42px"><div class="swatch__code">#1A412A</div></div>
          <div class="swatch swatch--light" style="background:#EBF5EE;min-height:42px"><div class="swatch__code">#EBF5EE</div></div>
        </div>
      </div>
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Warning</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#E06C34;min-height:64px"><div class="swatch__name">Warning</div><div class="swatch__code">#E06C34</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#552005;min-height:42px"><div class="swatch__code">#552005</div></div>
          <div class="swatch swatch--light" style="background:#FBF1DB;min-height:42px"><div class="swatch__code">#FBF1DB</div></div>
        </div>
      </div>
      <div class="col" style="flex:1;gap:6px">
        <div class="kbd-name">Error</div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#AC0700;min-height:64px"><div class="swatch__name">Error</div><div class="swatch__code">#AC0700</div></div>
        </div>
        <div class="row" style="gap:6px">
          <div class="swatch" style="background:#690602;min-height:42px"><div class="swatch__code">#690602</div></div>
          <div class="swatch swatch--light" style="background:#FBEFEC;min-height:42px"><div class="swatch__code">#FBEFEC</div></div>
        </div>
      </div>
  </div>
</div></body></html>
