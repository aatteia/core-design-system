<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_preview.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head><body><div class="card" style="height:230px">
  <div class="meta">Iconography — Font Awesome 7 Pro in production (substituted with Font Awesome 6 Free here). Five box sizes: 16 · 20 · 24 · 32 · 48.</div>
  <div class="row" style="gap:24px;align-items:center;flex-wrap:wrap">
    <div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-magnifying-glass" style="font-size:16px;color:#1A1A1A"></i>
      <div class="kbd-meta">16px</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-magnifying-glass" style="font-size:20px;color:#1A1A1A"></i>
      <div class="kbd-meta">20px</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-magnifying-glass" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta">24px</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-magnifying-glass" style="font-size:32px;color:#1A1A1A"></i>
      <div class="kbd-meta">32px</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-magnifying-glass" style="font-size:48px;color:#1A1A1A"></i>
      <div class="kbd-meta">48px</div></div>
    <div style="width:1px;background:#EBEBEB;align-self:stretch"></div>
    <div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-user" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">user</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-envelope" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">envelope</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-house" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">house</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-arrow-up-right" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">arrow-up-right</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-circle-info" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">circle-info</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-triangle-exclamation" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">triangle-exclamation</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-check" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">check</div></div><div class="col" style="align-items:center;gap:4px">
      <i class="fa-regular fa-xmark" style="font-size:24px;color:#1A1A1A"></i>
      <div class="kbd-meta" style="font-size:11px">xmark</div></div>
  </div>
  <div class="row" style="gap:16px;align-items:center;margin-top:6px">
    <div class="kbd-meta">REGULAR (default)</div>
    <i class="fa-regular fa-circle-info" style="font-size:20px;color:#3C4673"></i>
    <i class="fa-regular fa-bell" style="font-size:20px;color:#3C4673"></i>
    <i class="fa-regular fa-gear" style="font-size:20px;color:#3C4673"></i>
    <div style="width:1px;background:#EBEBEB;align-self:stretch;height:24px"></div>
    <div class="kbd-meta">SOLID (filled / active)</div>
    <i class="fa-solid fa-circle-info" style="font-size:20px;color:#3C4673"></i>
    <i class="fa-solid fa-bell" style="font-size:20px;color:#3C4673"></i>
    <i class="fa-solid fa-gear" style="font-size:20px;color:#3C4673"></i>
  </div>
</div></body></html>
