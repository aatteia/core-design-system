<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_preview.css">
</head><body><div class="card" style="height:320px">
  <div class="meta">Text inputs — default, focus, error, disabled. 1 px Neutral 300 border, 4 px radius.</div>
  <div class="row" style="gap:14px;flex-wrap:wrap">
    <div class="col" style="flex:1 1 280px;min-width:240px;gap:4px">
    <label style="font-family:'Open Sans';font-weight:600;font-size:14px;color:#1A1A1A">Surname </label>
    <input value="Smith" placeholder="Enter your surname" 
      style="font-family:'Open Sans';font-size:16px;line-height:24px;padding:10px 14px;border-radius:4px;width:100%;box-sizing:border-box;background:#fff;color:#1A1A1A;border:1px solid #ADADAD;" />
    <div class="kbd-meta">Default</div>
  </div><div class="col" style="flex:1 1 280px;min-width:240px;gap:4px">
    <label style="font-family:'Open Sans';font-weight:600;font-size:14px;color:#1A1A1A">Surname </label>
    <input value="Smith" placeholder="Enter your surname" 
      style="font-family:'Open Sans';font-size:16px;line-height:24px;padding:10px 14px;border-radius:4px;width:100%;box-sizing:border-box;background:#fff;color:#1A1A1A;border:1px solid #3C4673;outline:2px solid #B900DA;outline-offset:1px;" />
    <div class="kbd-meta">Focus</div>
  </div><div class="col" style="flex:1 1 280px;min-width:240px;gap:4px">
    <label style="font-family:'Open Sans';font-weight:600;font-size:14px;color:#1A1A1A">Surname <span style="color:#AC0700">*</span></label>
    <input value="" placeholder="Enter your surname" 
      style="font-family:'Open Sans';font-size:16px;line-height:24px;padding:10px 14px;border-radius:4px;width:100%;box-sizing:border-box;background:#fff;color:#1A1A1A;border:1px solid #AC0700;" />
    <div class="kbd-meta">Error · "Enter a valid surname."</div>
  </div><div class="col" style="flex:1 1 280px;min-width:240px;gap:4px">
    <label style="font-family:'Open Sans';font-weight:600;font-size:14px;color:#1A1A1A">Surname </label>
    <input value="" placeholder="" disabled
      style="font-family:'Open Sans';font-size:16px;line-height:24px;padding:10px 14px;border-radius:4px;width:100%;box-sizing:border-box;background:#fff;color:#1A1A1A;border:1px solid #EBEBEB;background:#F8F8F8;color:#868686;" />
    <div class="kbd-meta">Disabled</div>
  </div>
  </div></div></body></html>
